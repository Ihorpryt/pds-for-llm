<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion — Portside Design System</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../checkbox/checkbox.css">
<link rel="stylesheet" href="accordion.css">
<link rel="stylesheet" href="../button/button.css">
<style>
  /* Page chrome only — not part of the component. */
  body {
    margin: 0;
    padding: var(--spacing-32);
    background: var(--background-content-bg-color-alt2);
    color: var(--foreground-content-text-color);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: var(--font-size-sm);
    line-height: var(--line-height-sm);
  }
  h1 { font-size: var(--font-size-3xl); line-height: var(--line-height-3xl); margin: 0 0 var(--spacing-8); color: var(--foreground-content-text-color-hover); }
  h2 { font-size: var(--font-size-xl); line-height: var(--line-height-xl); margin: var(--spacing-40) 0 var(--spacing-16); color: var(--foreground-content-text-color-hover); }
  .sub { margin: 0 0 var(--spacing-24); color: var(--foreground-content-text-color-alt2); }
  .panel { background: var(--background-content-bg-color); border: var(--border-1) solid var(--border-light); border-radius: var(--control-radius-card-default-radius); padding: var(--spacing-24); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-24); }
  .row + .row { margin-top: var(--spacing-20); }
  .stack { display: flex; flex-direction: column; align-items: flex-start; gap: var(--spacing-12); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: var(--spacing-10) var(--spacing-12); text-align: left; border-bottom: var(--border-1) solid var(--border-light); vertical-align: middle; }
  th { font-weight: var(--font-weight-semibold); color: var(--foreground-content-text-color-alt2); font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: var(--letter-spacing-wider); }
  tbody th { text-transform: none; font-size: var(--font-size-sm); color: var(--foreground-content-text-color-hover); letter-spacing: var(--letter-spacing-normal); white-space: nowrap; }
  .toolbar { display: flex; gap: var(--spacing-8); align-items: center; margin-bottom: var(--spacing-24); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--font-size-xs); color: var(--foreground-content-text-color-alt2); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .side { width: 226px; padding: var(--spacing-8) var(--spacing-12); background: var(--background-content-bg-color-alt2); border: var(--border-1) solid var(--border-light); border-radius: var(--radius-8); }
</style>
</head>
<body>

<h1>Accordion</h1>
<p class="sub">Collapsible sections with a small uppercase title, built on <code>&lt;details&gt;</code>. All values resolve through <code>tokens.css</code>.</p>

<div class="toolbar">
  <button class="psds-btn psds-btn--sm psds-btn--secondary" id="theme-toggle" type="button">Toggle dark theme</button>
</div>

<div class="row" style="align-items: flex-start">
  <div>
    <h2>Filter sections</h2>
    <div class="side">
      <div class="psds-accordion-group">
        <details class="psds-accordion" open>
          <summary class="psds-accordion__header"><span class="psds-accordion__title">Trip</span></summary>
          <div class="psds-accordion__body">
      <label class="psds-checkbox psds-checkbox--sm"><input class="psds-checkbox__input" type="checkbox" checked><span class="psds-checkbox__text"><span class="psds-checkbox__label">Trip Number</span></span></label>
      <label class="psds-checkbox psds-checkbox--sm"><input class="psds-checkbox__input" type="checkbox"><span class="psds-checkbox__text"><span class="psds-checkbox__label">Trip Stage</span></span></label>
      <label class="psds-checkbox psds-checkbox--sm"><input class="psds-checkbox__input" type="checkbox"><span class="psds-checkbox__text"><span class="psds-checkbox__label">Trip Type</span></span></label>
          </div>
        </details>
        <details class="psds-accordion">
          <summary class="psds-accordion__header"><span class="psds-accordion__title">Leg Details</span></summary>
          <div class="psds-accordion__body">
      <label class="psds-checkbox psds-checkbox--sm"><input class="psds-checkbox__input" type="checkbox"><span class="psds-checkbox__text"><span class="psds-checkbox__label">Leg Number</span></span></label>
      <label class="psds-checkbox psds-checkbox--sm"><input class="psds-checkbox__input" type="checkbox"><span class="psds-checkbox__text"><span class="psds-checkbox__label">Leg Status</span></span></label>
          </div>
        </details>
        <details class="psds-accordion" open>
          <summary class="psds-accordion__header"><span class="psds-accordion__title">Route &amp; Airports</span></summary>
          <div class="psds-accordion__body">
      <label class="psds-checkbox psds-checkbox--sm"><input class="psds-checkbox__input" type="checkbox"><span class="psds-checkbox__text"><span class="psds-checkbox__label">Departure Airport</span></span></label>
      <label class="psds-checkbox psds-checkbox--sm"><input class="psds-checkbox__input" type="checkbox"><span class="psds-checkbox__text"><span class="psds-checkbox__label">Arrival Airport</span></span></label>
          </div>
        </details>
      </div>
    </div>
  </div>

  <div>
    <h2>States</h2>
    <div class="side">
      <div class="psds-accordion-group">
        <details class="psds-accordion"><summary class="psds-accordion__header"><span class="psds-accordion__title">Default (closed)</span></summary><div class="psds-accordion__body">Content</div></details>
        <details class="psds-accordion is-hover"><summary class="psds-accordion__header"><span class="psds-accordion__title">Hover</span></summary><div class="psds-accordion__body">Content</div></details>
        <details class="psds-accordion is-focus"><summary class="psds-accordion__header"><span class="psds-accordion__title">Focus</span></summary><div class="psds-accordion__body">Content</div></details>
        <details class="psds-accordion" open><summary class="psds-accordion__header"><span class="psds-accordion__title">Open</span></summary><div class="psds-accordion__body"><span>Any content stacks here with a 10px gap.</span><span>Second line.</span></div></details>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
</script>
</body>
</html>
